# dbt_project/packages.yml
# ===========================================================================
# dbt_utils is required: both marts use dbt_utils.accepted_range and
# dbt_utils.unique_combination_of_columns. Without this file `dbt deps`
# installs nothing and `dbt test` fails on an unresolvable macro.
#
# Pinned to a git tag rather than declared through dbt Hub. Same package,
# one less third-party service between a clone and a green build.
# ===========================================================================
packages:
  - git: "https://github.com/dbt-labs/dbt-utils.git"
    revision: 1.3.0
